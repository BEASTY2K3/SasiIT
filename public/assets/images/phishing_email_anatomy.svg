<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#FFFFFF; font-family:'Plus Jakarta Sans',system-ui,sans-serif;">
  <rect width="1000" height="520" fill="#FFFFFF"/>
  
  <text x="50" y="45" font-family="'Space Grotesk',sans-serif" font-size="20" font-weight="700" fill="#0F172A">Anatomy of a Sophisticated Spear-Phishing Attack</text>
  <text x="50" y="70" font-size="13" fill="#64748B">Technical Header Inspection &bull; Social Engineering Indicators &bull; Payload &amp; Credential Harvesting Mechanics</text>

  <!-- Email Window Frame -->
  <g transform="translate(50, 95)">
    <rect width="580" height="395" rx="8" fill="#FAFAFA" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="580" height="36" rx="8" fill="#F1F5F9"/>
    <circle cx="20" cy="18" r="5" fill="#CBD5E1"/>
    <circle cx="35" cy="18" r="5" fill="#CBD5E1"/>
    <circle cx="50" cy="18" r="5" fill="#CBD5E1"/>
    <text x="80" y="22" font-size="12" font-weight="600" fill="#475569">Corporate Mail Client &mdash; Inbox Security Preview</text>

    <!-- Email Headers -->
    <g transform="translate(25, 55)">
      <text x="0" y="15" font-size="12" font-weight="700" fill="#475569">From:</text>
      <text x="55" y="15" font-size="12" fill="#0F172A">"Global Payroll Services" &lt;support@payro1l-verify-auth.com&gt;</text>
      
      <text x="0" y="38" font-size="12" font-weight="700" fill="#475569">To:</text>
      <text x="55" y="38" font-size="12" fill="#0F172A">employee@enterprise-corp.com</text>

      <text x="0" y="61" font-size="12" font-weight="700" fill="#475569">Subject:</text>
      <text x="55" y="61" font-size="12" font-weight="700" fill="#DC2626">CRITICAL: Mandatory Salary Direct Deposit Verification [Immediate Action Required]</text>
      <line x1="0" y1="75" x2="530" y2="75" stroke="#E2E8F0" stroke-width="1"/>
    </g>

    <!-- Email Body -->
    <g transform="translate(25, 155)">
      <text x="0" y="15" font-size="13" fill="#1E293B">Dear Colleague,</text>
      <text x="0" y="40" font-size="13" fill="#334155">Due to annual bank gateway updates, your month-end salary payout is suspended.</text>
      <text x="0" y="62" font-size="13" fill="#334155">You must verify your tax identification number and banking credentials within 2 hours,</text>
      <text x="0" y="84" font-size="13" fill="#334155">or your disbursement will be rolled over to the subsequent pay period.</text>

      <!-- Phishing Button -->
      <rect x="0" y="110" width="240" height="42" rx="6" fill="#DC2626"/>
      <text x="120" y="136" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Verify Banking Credentials Now</text>

      <!-- Hover URL Inspection Box -->
      <rect x="0" y="170" width="400" height="30" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
      <text x="10" y="190" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#B91C1C">Actual URL: https://bit.ly/3x8q9Z &rarr; http://harvest-creds-ru.org/login</text>
    </g>
  </g>

  <!-- Right Analysis Panel -->
  <g transform="translate(655, 95)">
    <rect width="295" height="395" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="295" height="36" rx="8" fill="#0F172A"/>
    <text x="147" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">FORENSIC RED FLAGS</text>

    <!-- Indicator 1 -->
    <g transform="translate(15, 55)">
      <rect width="265" height="65" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#991B1B">1. TYPOSQUATTING DOMAIN</text>
      <text x="12" y="40" font-size="11" fill="#7F1D1D">Sender uses numeral '1' instead of letter 'l' (payro1l-verify). SPF/DKIM validation fails.</text>
    </g>

    <!-- Indicator 2 -->
    <g transform="translate(15, 135)">
      <rect width="265" height="65" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#991B1B">2. ARTIFICIAL PANIC &amp; URGENCY</text>
      <text x="12" y="40" font-size="11" fill="#7F1D1D">Threatens financial loss within 2 hours to bypass rational corporate verification protocols.</text>
    </g>

    <!-- Indicator 3 -->
    <g transform="translate(15, 215)">
      <rect width="265" height="65" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#991B1B">3. MISMATCHED HYPERLINK</text>
      <text x="12" y="40" font-size="11" fill="#7F1D1D">Visible button text does not match underlying URL destination. Uses URL shorteners to mask origin.</text>
    </g>

    <!-- Indicator 4 -->
    <g transform="translate(15, 295)">
      <rect width="265" height="75" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#166534">CORRECT PROTOCOL</text>
      <text x="12" y="40" font-size="11" fill="#14532D">Never click unsolicited links. Navigate directly to verified enterprise portal or verify via internal HR telephone.</text>
    </g>
  </g>
</svg>